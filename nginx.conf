# Single-origin entry point for the SPA.
# Serves the built frontend and reverse-proxies the API + WebSocket to the gateway, so the whole
# app lives on ONE origin. That means: works behind any host/tunnel (LAN, Cloudflare) with no
# CORS and no per-URL rebuild — the browser only ever talks to the origin it loaded from.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS, so the gateway hostname is re-resolved if its container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Static SPA — fall back to index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST API (+ Server-Sent Events for notifications) → gateway.
  location /api/ {
    set $upstream http://api-gateway:11032;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE: keep the connection open and unbuffered.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # WebSocket (game STOMP) → gateway.
  location /ws/ {
    set $upstream http://api-gateway:11032;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }
}
