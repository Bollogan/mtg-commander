name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test all microservices
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mtg_deck_builder
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and verify all modules
        working-directory: mtg-deck-builder/backend
        run: mvn -f pom-parent.xml -DskipTests clean package

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            mtg-deck-builder/backend/*/target/*.jar
          retention-days: 7
