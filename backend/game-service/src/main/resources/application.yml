server:
  port: 8085

spring:
  application:
    name: game-service
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:11026}
      password: ${SPRING_REDIS_PASSWORD:}

# Game state session TTL in Redis (abandoned rooms expire)
game:
  session-ttl-hours: ${GAME_SESSION_TTL_HOURS:6}
  # socket.io (netty-socketio) — separate Netty server; the gateway proxies /socket.io/** here.
  socketio:
    port: ${GAME_SOCKETIO_PORT:9092}

# Same secret used by the gateway/auth-service to sign JWTs; used to verify the socket.io handshake.
security:
  jwt:
    secret: ${JWT_SECRET:SGVsbG8gV29ybGQgVGhpcyBpcyBhIFNlY3JldCBLZXkgZm9yIEpXVCBFbmNvZGluZw==}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:11024/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
