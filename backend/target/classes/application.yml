spring:
  application:
    name: mtg-deck-builder-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mtg_deck_builder}
    username: ${DB_USER:mtg}
    password: ${DB_PASSWORD:mtg}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:z8HkRk2sL8qLZQk1pQ9vEw7u3u0C8x0XbR9qG2e3W1s=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
