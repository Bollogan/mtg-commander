# docker-compose.override.yml — local development overrides
# This file is merged automatically with docker-compose.yml when running
# `docker-compose up` locally. Do NOT commit secrets here.

services:
  postgres:
    ports:
      - "11020:5432"

  mongodb:
    ports:
      - "11022:27017"

  redis:
    ports:
      - "11026:6379"

  eureka-server:
    environment:
      SPRING_PROFILES_ACTIVE: dev

  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: dev

  auth-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev

  # Local forum-service runs the demo data seeder (populates MongoDB with example forums,
  # posts, nested replies and votes on first boot; it skips itself if data already exists).
  forum-service:
    environment:
      SPRING_PROFILES_ACTIVE: seed
