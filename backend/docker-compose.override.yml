# docker-compose.override.yml — local development overrides
# This file is merged automatically with docker-compose.yml when running
# `docker-compose up` locally. Do NOT commit secrets here.

services:
  postgres:
    ports:
      - "11020:5432"

  mongodb:
    ports:
      - "11022:27017"

  redis:
    ports:
      - "11026:6379"

  eureka-server:
    environment:
      SPRING_PROFILES_ACTIVE: dev

  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: dev

  auth-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev
