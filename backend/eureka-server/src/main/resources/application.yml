server:
  port: 11024
  servlet:
    context-path: /eureka-mtgc

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka-mtgc/eureka/
  server:
    enableSelfPreservation: false
    evictionIntervalTimerInMs: 3000
    renewalPercentThreshold: 0.85

spring:
  application:
    name: eureka-server
