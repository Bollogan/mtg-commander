server:
  port: 8084

spring:
  application:
    name: deck-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:11022/mtg_deck}
      auto-index-creation: true
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:11026}
      password: ${SPRING_REDIS_PASSWORD:}

# Scryfall integration + Redis cache (TTL 24h per plan, risk mitigation for 10 req/s limit)
scryfall:
  base-url: ${SCRYFALL_BASE_URL:https://api.scryfall.com}
  user-agent: mtg-deck-builder/1.0 (+https://github.com)
  cache-ttl-hours: 24

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:11024/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mtg.deckbuilder.deck.scryfall: ${SCRYFALL_LOG_LEVEL:INFO}
