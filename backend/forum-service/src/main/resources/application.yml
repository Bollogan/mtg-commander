server:
  port: 8083

spring:
  application:
    name: forum-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:11022/mtg_forum}
      auto-index-creation: true
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:11026}
      password: ${SPRING_REDIS_PASSWORD:}

notifications:
  channel: ${NOTIFICATIONS_CHANNEL:notifications}

forum:
  activity-score:
    # Recompute every forum's weeklyActivityScore hourly (spec §2.2). Cron: sec min hour * * *
    cron: ${FORUM_ACTIVITY_SCORE_CRON:0 0 * * * *}
  events:
    # Redis Pub/Sub channel for realtime forum events fanned out over SSE (Phase 6, spec §7.2).
    channel: ${FORUM_EVENTS_CHANNEL:forum-events}
    # How long an idle SSE connection is held open before the client reconnects.
    sse-timeout-ms: ${FORUM_EVENTS_SSE_TIMEOUT_MS:3600000}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:11024/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
