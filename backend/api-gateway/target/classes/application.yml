server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        # Auth Service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth(?<segment>/?.*), /api/auth$\{segment}
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback

        # Search Service (Scryfall)
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/scryfall/**
          filters:
            - RewritePath=/api/scryfall(?<segment>/?.*), /api/scryfall$\{segment}
            - name: CircuitBreaker
              args:
                name: searchCircuitBreaker
                fallbackUri: forward:/fallback

        # Deck Service
        - id: deck-service
          uri: lb://deck-service
          predicates:
            - Path=/api/decks/**
          filters:
            - RewritePath=/api/decks(?<segment>/?.*), /api/decks$\{segment}
            - name: CircuitBreaker
              args:
                name: deckCircuitBreaker
                fallbackUri: forward:/fallback

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
