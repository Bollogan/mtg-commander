server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://localhost:3000
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        # Auth Service — public, no JWT required (filter skips these)
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback

        # User Service
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userCircuitBreaker
                fallbackUri: forward:/fallback

        # Forum Service
        - id: forum-service
          uri: lb://forum-service
          predicates:
            - Path=/api/forums/**,/api/posts/**,/api/events/**
          filters:
            - name: CircuitBreaker
              args:
                name: forumCircuitBreaker
                fallbackUri: forward:/fallback

        # Deck Service
        - id: deck-service
          uri: lb://deck-service
          predicates:
            - Path=/api/decks/**
          filters:
            - name: CircuitBreaker
              args:
                name: deckCircuitBreaker
                fallbackUri: forward:/fallback

        # Game Service
        - id: game-service
          uri: lb://game-service
          predicates:
            - Path=/api/game/**,/ws/game/**
          filters:
            - name: CircuitBreaker
              args:
                name: gameCircuitBreaker
                fallbackUri: forward:/fallback

        # AI Service
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - name: CircuitBreaker
              args:
                name: aiCircuitBreaker
                fallbackUri: forward:/fallback

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationCircuitBreaker
                fallbackUri: forward:/fallback

        # Search Service (legacy — Scryfall proxy, to be merged into deck-service)
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/scryfall/**
          filters:
            - name: CircuitBreaker
              args:
                name: searchCircuitBreaker
                fallbackUri: forward:/fallback

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}:${server.port}

security:
  jwt:
    secret: ${JWT_SECRET:SGVsbG8gV29ybGQgVGhpcyBpcyBhIFNlY3JldCBLZXkgZm9yIEpXVCBFbmNvZGluZw==}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
